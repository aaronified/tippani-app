name: Release

# Builds a release-signed APK and attaches it to a GitHub Release. It is the half of the update check that
# publishes what the app looks for: a release tagged app-vX.Y.Z whose APK is named tippani-app-vX.Y.Z.apk.
#
# Runs for a version tag like app-v0.2.0, and the owner cuts one from the Actions tab: run this workflow from
# main and type the version (0.2.0, no "app-v"). The prepare job then does the release commit itself
# (tools/prepare_release.py: bumps pubspec.yaml and lib/harness/version.dart, dates the CHANGELOG's [Unreleased]
# section), pushes it to main, and tags it. A tag pushed with GITHUB_TOKEN does not start another run, so the
# release is built once, by this run. Pushing a version tag by hand still starts the release job alone. The tag
# without its "app-v" becomes versionName. versionCode is this workflow's run number, which only goes up, so each
# release installs over the one before. Renaming this file starts a new workflow whose run numbers begin again at
# 1, and Android refuses to install a lower versionCode over a higher one.
#
# THIS WORKFLOW CANNOT RUN UNTIL THE OWNER SETS FIVE REPOSITORY SECRETS (docs/wiki/Releasing.md says how). With
# any missing it fails in its first seconds, naming the one, rather than publishing something unusable:
#   RELEASE_DEPLOY_KEY   the private half of an SSH deploy key of this repository with write access, so the
#                        release commit can be pushed to a protected main (deploy keys can be on its bypass list)
#   KEYSTORE_BASE64      base64 of your release keystore (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD    the keystore's store password
#   KEY_ALIAS            alias of the signing key inside the keystore
#   KEY_PASSWORD         that key's password
#
# The committed android/ signs release builds with the debug key and never reads a key.properties file. Instead
# the keystore is decoded to $RUNNER_TEMP, outside the workspace, and the Android Gradle Plugin's injected signing
# properties (android.injected.signing.*, the ones Android Studio's "Generate Signed APK" passes) are appended to
# android/gradle.properties. AGP uses those in place of the signing config the build file names, so no Gradle
# file is edited. Before anything is published the APK's certificate is checked against the keystore's, and both
# the keystore and the properties are removed at the end whether the job passed or failed.
#
# Losing the keystore means no existing installation can ever be upgraded, and Android offers no way to recover
# from that. Back it up somewhere you trust, separately from this repository.

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0 (no app-v). Run from main."
        required: true
        type: string

permissions:
  contents: write

# One release at a time; a second waits rather than cancelling the first, which may be half way through
# publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Manual runs only. Makes the release commit and tag that the release job then builds; a pushed tag skips it.
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check this run is from main and the version is new
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::A release is cut from main, but this run is for '$GITHUB_REF'. Run the workflow again and choose main under 'Use workflow from'."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version '$VERSION' is not like 0.2.0 (three numbers, no leading app-v)."
            exit 1
          fi
          if git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/app-v$VERSION" >/dev/null 2>&1; then
            echo "::error::The tag app-v$VERSION already exists. Choose a higher version."
            exit 1
          fi

      # main's ruleset asks for a pull request and passing checks, which GITHUB_TOKEN cannot bypass. Deploy keys
      # are on its bypass list, so the release commit is pushed with one: RELEASE_DEPLOY_KEY is the private half
      # of an SSH deploy key of this repository with write access. The key is rebuilt from whatever the secret
      # holds, so a paste that lost its BEGIN and END lines, its line breaks or its last newline still works;
      # ssh-keygen then checks it is a private key before anything is committed.
      - name: Read the release deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::The RELEASE_DEPLOY_KEY secret is not set, so the release commit cannot be pushed to main. See docs/wiki/Releasing.md."
            exit 1
          fi
          key="$RUNNER_TEMP/release_key"
          body=$(printf '%s' "$RELEASE_DEPLOY_KEY" \
            | sed -E 's/-----(BEGIN|END) [A-Z ]*PRIVATE KEY-----//g' \
            | tr -d ' \t\r\n')
          {
            echo "-----BEGIN OPENSSH PRIVATE KEY-----"
            printf '%s\n' "$body" | fold -w 70
            echo "-----END OPENSSH PRIVATE KEY-----"
          } > "$key"
          chmod 600 "$key"
          if ! ssh-keygen -y -f "$key" > /dev/null; then
            rm -f "$key"
            echo "::error::RELEASE_DEPLOY_KEY is not an OpenSSH private key. Paste the private file made by ssh-keygen (not the .pub)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      # Standard library only, so it runs on the runner's own python3. Fails with a message when [Unreleased] is
      # empty or the version is not higher.
      - name: Prepare the release commit
        env:
          VERSION: ${{ inputs.version }}
        run: python3 tools/prepare_release.py "$VERSION"

      - name: Commit, push to main and tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/harness/version.dart CHANGELOG.md
          git commit -m "Release $VERSION"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/release_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main
          # The tag goes up with GITHUB_TOKEN, not the deploy key: a tag pushed with a deploy key would start this
          # workflow a second time, building the release twice.
          git tag -a "app-v$VERSION" -m "Release $VERSION"
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "app-v$VERSION"
          echo "tag=app-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagged app-v$VERSION"

  release:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      # The tag to build: prepare's for a manual run, else the pushed tag.
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      # First, so a run that cannot produce a release fails in seconds rather than after a build. The version
      # comes from the tag: the one prepare made for a manual run, or the pushed one. The trigger's "app-v*"
      # also matches tags like "app-vintage", which this rejects.
      - name: Check this run is for a version tag
        run: |
          if { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$GITHUB_REF_TYPE" != tag ]; } || ! [[ "$TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Releases are built from a version tag like app-v0.2.0, but this run is for the $GITHUB_REF_TYPE '$TAG'. Run this workflow from main and type the version, or push a tag (git tag app-v0.2.0 && git push origin app-v0.2.0)."
            exit 1
          fi

      # Also before any build, and for the same reason: with a missing secret the signing step would fail only
      # after the whole build. Naming every missing one at once saves a run per secret.
      - name: Check the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set; cannot sign a release. See docs/wiki/Releasing.md."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Also before any build: the APK's versionName is the tag, but the app reports appVersion
      # (lib/harness/version.dart), kept in step with pubspec.yaml. A tag on a commit whose version files were not
      # bumped would publish an APK that calls itself the previous version, and the update check would keep
      # offering it the update it already is. Standard library only, so it runs before anything is installed.
      - name: Check the tag matches the version files
        run: python3 tools/check_release_version.py "$TAG"

      - name: Test the release tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Secrets come in through env rather than being expanded into the script, where a quote or $ in a password
      # would become shell syntax. The keystore goes to $RUNNER_TEMP so it is never inside the workspace.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::The KEYSTORE_BASE64 secret is not valid base64. Create it with: base64 -w0 release.jks"
            exit 1
          fi

          # gradle.properties is a Java .properties file, so values are escaped to reach AGP exactly as typed: a
          # bare backslash would start an escape sequence, leading spaces would be dropped, and a newline would
          # end the value. Anything outside printable ASCII becomes \uXXXX, so the file's character encoding
          # cannot matter either.
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" python3 - <<'PY'
          import os

          def escape(value):
              out = []
              for ch in value:
                  if ch in "\\ =:#!":
                      out.append("\\" + ch)
                  elif ch in "\t\n\r\f":
                      out.append({"\t": "\\t", "\n": "\\n", "\r": "\\r", "\f": "\\f"}[ch])
                  elif " " < ch <= "~":
                      out.append(ch)
                  else:
                      units = ch.encode("utf-16-be")
                      out += ["\\u" + units[i:i + 2].hex() for i in range(0, len(units), 2)]
              return "".join(out)

          props = {
              "android.injected.signing.store.file": os.environ["KEYSTORE_FILE"],
              "android.injected.signing.store.password": os.environ["KEYSTORE_PASSWORD"],
              "android.injected.signing.key.alias": os.environ["KEY_ALIAS"],
              "android.injected.signing.key.password": os.environ["KEY_PASSWORD"],
          }
          path = "android/gradle.properties"
          with open(path, "rb") as f:
              ends_with_newline = f.read().endswith(b"\n")
          with open(path, "a", encoding="ascii") as f:
              if not ends_with_newline:
                  f.write("\n")
              for key, value in props.items():
                  f.write(f"{key}={escape(value)}\n")
          PY

      # versionName is the tag without its "app-v"; the guard above has already checked its shape. versionCode is
      # the run number: see the top.
      - name: Build the release APK
        run: |
          flutter build apk --release \
            --build-name="${TAG#app-v}" \
            --build-number=${{ github.run_number }}

      # If AGP ever ignored the injected properties, the build above would still succeed, quietly signed with the
      # debug key. An APK like that cannot upgrade an installed release, and whoever installs it cannot upgrade
      # to the next one. So compare certificates before publishing.
      - name: Check the APK is signed with the release key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk

          # ubuntu-latest carries several build-tools versions; use the newest.
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          if [ ! -x "$apksigner" ]; then
            echo "::error::No apksigner under $ANDROID_HOME/build-tools, so the release signature cannot be checked."
            exit 1
          fi

          if ! apk_certs=$("$apksigner" verify --print-certs "$apk" 2>&1); then
            printf '%s\n' "$apk_certs"
            echo "::error::apksigner could not verify $apk, so it will not be published."
            exit 1
          fi
          printf '%s\n' "$apk_certs"

          if ! key_certs=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" 2>&1); then
            printf '%s\n' "$key_certs"
            echo "::error::keytool could not read the key from the keystore. Check the KEYSTORE_PASSWORD and KEY_ALIAS secrets."
            exit 1
          fi

          # Both print the certificate's SHA-256 in hex, keytool in upper case with colons, so strip and
          # lower-case both before comparing.
          #
          # apksigner words its signer lines two ways. Build-tools 36 prints "Signer #1 certificate SHA-256
          # digest: <hex>"; build-tools 37 names the signature scheme instead, "V2 Signer: certificate SHA-256
          # digest: <hex>" ("V3.0 Signer:", or "V2 Signer #2:" when there are several signers). Repeated digests
          # are dropped in case one certificate is ever listed under more than one scheme; two different
          # certificates still concatenate and fail the comparison.
          normalise() { tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }
          apk_sha=$(printf '%s\n' "$apk_certs" \
            | sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer( #[0-9]+)?:) certificate SHA-256 digest: //p' \
            | tr -d ': \t\r' | tr '[:upper:]' '[:lower:]' | sort -u | tr -d '\n')
          key_sha=$(printf '%s\n' "$key_certs" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | normalise)

          # Say so plainly when the output could not be read, rather than claiming the APK is signed with some
          # other key.
          if [ -z "$apk_sha" ]; then
            echo "::error::No signer certificate SHA-256 was found in apksigner's output above, so $apk cannot be checked and will not be published. If apksigner's wording has changed, update the sed pattern in this step."
            exit 1
          fi

          if [ -z "$key_sha" ] || [ "$apk_sha" != "$key_sha" ]; then
            echo "::error::$apk is not signed with the release key, so it will not be published. APK certificate SHA-256: ${apk_sha:-none found}. Release key certificate SHA-256: ${key_sha:-none found}."
            exit 1
          fi
          echo "APK is signed with the release key (certificate SHA-256 $apk_sha)."

      # The release notes are the CHANGELOG's section for this version, the one list of what changed. A tag
      # pushed by hand has no dated section, so it gets a pointer to the CHANGELOG instead.
      - name: Write the release notes from the CHANGELOG
        run: |
          version="${TAG#app-v}"
          notes="$RUNNER_TEMP/release_notes.md"
          if python3 tools/prepare_release.py --notes "$version" > "$RUNNER_TEMP/changelog_section.md"; then
            cp "$RUNNER_TEMP/changelog_section.md" "$notes"
          else
            echo "::warning::No CHANGELOG section for $version; the notes point to the CHANGELOG."
            echo "See CHANGELOG.md in the source for this build." > "$notes"
          fi
          {
            echo
            echo "Tippani for Android is GPL-3.0."
            echo "Source for this exact build is the tag it was made from."
          } >> "$notes"

      # The APK is named what the app's update check looks for: tippani-app-vX.Y.Z.apk. The universal APK only:
      # it installs on any device, and a single file leaves nobody guessing which build is theirs.
      - name: Name the APK for the update check
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/tippani-app-v${TAG#app-v}.apk"

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          # A manual run's ref is main, so name the tag rather than let the action take it from the ref.
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: build/tippani-app-v*.apk
          generate_release_notes: false
          body_path: ${{ runner.temp }}/release_notes.md

      # always(), so this runs even when a step above failed. The runner empties $RUNNER_TEMP after the job
      # anyway, but on a self-hosted runner the workspace, and the passwords in android/gradle.properties,
      # persist.
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          if [ -f android/gradle.properties ]; then
            sed -i '/^android\.injected\.signing\./d' android/gradle.properties
          fi
